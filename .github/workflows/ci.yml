name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Lint for syntax errors and undefined names
        run: ruff check --select E9,F63,F7,F82 .
      - name: Byte-compile the bot
        run: python -m compileall -q bot.py launcher.py config.py cogs services utils
